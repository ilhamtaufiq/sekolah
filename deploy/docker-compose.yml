# Stack lokal lengkap: db + api + web. Jalankan: docker compose -f deploy/docker-compose.yml up --build
services:
  db:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: simas-root-dev
      MYSQL_DATABASE: simas
      MYSQL_USER: simas
      MYSQL_PASSWORD: simas-dev
    ports: ["3306:3306"]
    volumes: ["dbdata:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-usimas", "-psimas-dev"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: mysql://simas:simas-dev@db:3306/simas
      JWT_SECRET: dev-only-secret-change-me-please-32+chars
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: Dockerfile.web
    environment:
      API_UPSTREAM: api:8080
    ports: ["8081:80"]
    depends_on: [api]

volumes:
  dbdata:
