# Stack lokal lengkap: db + api + web. Jalankan: docker compose -f deploy/docker-compose.yml up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: simas
      POSTGRES_PASSWORD: simas-dev
      POSTGRES_DB: simas
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simas -d simas"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgres://simas:simas-dev@db:5432/simas
      JWT_SECRET: dev-only-secret-change-me-please-32+chars
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: Dockerfile.web
    environment:
      API_UPSTREAM: api:8080
    ports: ["8081:80"]
    depends_on: [api]

volumes:
  pgdata:
