name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Rust)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: simas
          POSTGRES_PASSWORD: simas-test
          POSTGRES_DB: simas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U simas -d simas_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://simas:simas-test@127.0.0.1:5432/simas_test
      JWT_SECRET: ci-only-secret-with-more-than-32-characters
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  docker:
    name: Docker build (tanpa push)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Image dibangun dan dideploy oleh Coolify dari repo ini. CI hanya memastikan Dockerfile tidak rusak.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: false
