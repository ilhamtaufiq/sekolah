[package]
name = "simas-api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["multipart"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
jsonwebtoken = { version = "12.0.0", features = ["rust_crypto"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", features = ["runtime-tokio", "tls-rustls-ring", "mysql", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
typst = "0.15.1"
typst-kit = { version = "0.15.1", features = ["embedded-fonts"] }
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
uuid = { version = "1.29.3", features = ["v4", "serde"] }
